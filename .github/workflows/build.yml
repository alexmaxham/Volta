name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Test battery logic
        run: ./gradlew -p core test

      - name: Build APKs
        run: |
          set -o pipefail
          ./gradlew assembleDebug assembleRelease 2>&1 | tee build.log

      - name: Show build errors
        if: failure()
        run: |
          grep -E "^e: |error:|What went wrong" -A12 build.log | grep -v "Required by\|debugRuntimeClasspath\|releaseRuntimeClasspath" | head -150

      - uses: actions/upload-artifact@v4
        with:
          name: volta-apks
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
