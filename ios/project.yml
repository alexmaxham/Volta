# Generate Volta.xcodeproj with `xcodegen generate` (brew install xcodegen). ios/bench.sh does this for you.
name: Volta
options:
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
configFiles:
  Debug: Config/Volta.xcconfig
  Release: Config/Volta.xcconfig
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: "1"
    # The Gradle build that makes VoltaCore writes outside the build folder.
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    # VoltaCore.framework, the shared Kotlin logic from core/, built by the script below.
    "FRAMEWORK_SEARCH_PATHS[sdk=iphoneos*]": $(SRCROOT)/../core/build/bin/iosArm64/releaseFramework
    "FRAMEWORK_SEARCH_PATHS[sdk=iphonesimulator*]": $(SRCROOT)/../core/build/bin/iosSimulatorArm64/releaseFramework
    OTHER_LDFLAGS: ["$(inherited)", "-framework", "VoltaCore", "-lc++"]
targets:
  Volta:
    type: application
    platform: iOS
    sources: [Volta, Shared]
    preBuildScripts:
      - name: Build VoltaCore
        script: exec "$SRCROOT/Scripts/build-core.sh"
        basedOnDependencyAnalysis: false
    info:
      path: Volta/Info.plist
      properties:
        CFBundleDisplayName: Volta
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        VoltaAppGroup: $(VOLTA_APP_GROUP)
        # Apps whose URL schemes Volta checks to show which benchmark apps are installed.
        LSApplicationQueriesSchemes: [googlechromes, youtube, instagram, snssdk1233, twitter, youtubemusic]
    entitlements:
      path: Volta/Volta.entitlements
      properties:
        com.apple.security.application-groups: [$(VOLTA_APP_GROUP)]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(VOLTA_BUNDLE_ID)
  VoltaBench:
    type: bundle.ui-testing
    platform: iOS
    sources: [VoltaBenchUITests, Shared]
    dependencies:
      - target: Volta
    preBuildScripts:
      - name: Build VoltaCore
        script: exec "$SRCROOT/Scripts/build-core.sh"
        basedOnDependencyAnalysis: false
    info:
      path: VoltaBenchUITests/Info.plist
      properties:
        VoltaAppGroup: $(VOLTA_APP_GROUP)
    entitlements:
      path: VoltaBenchUITests/VoltaBench.entitlements
      properties:
        com.apple.security.application-groups: [$(VOLTA_APP_GROUP)]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(VOLTA_BUNDLE_ID).bench
        TEST_TARGET_NAME: Volta
schemes:
  Volta:
    build:
      targets:
        Volta: all
        VoltaBench: [test]
    run:
      config: Debug
    test:
      targets: [VoltaBench]
      # A 15-hour run would otherwise fill the Mac with screenshots.
      captureScreenshotsAutomatically: false
      deleteScreenshotsWhenEachTestSucceeds: true
